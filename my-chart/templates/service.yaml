# Service for Grafana
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: {{ .Values.namespace }}  # This sets the namespace dynamically

spec:
  selector:
    app: grafana
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000  # Grafana's default port
  type: LoadBalancer

---
# Service for Prometheus
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: {{ .Values.namespace }}  # This sets the namespace dynamically

spec:
  selector:
    app: prometheus
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090  # Prometheus's default port
  type: LoadBalancer

---
# Service for ArgoCD
apiVersion: v1
kind: Service
metadata:
  name: argocd-service
  namespace: {{ .Values.namespace }}  # This sets the namespace dynamically

spec:
  selector:
    app: argocd
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080  # ArgoCD's default port
  type: LoadBalancer
